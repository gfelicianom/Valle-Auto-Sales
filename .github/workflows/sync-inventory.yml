name: Sync inventory from Airtable

on:
  # PAUSED 2026-07-30 for the Airtable attachment migration (replacing full-res
  # photos with the resized copies the site already serves). The sync prunes
  # img/cars to match Airtable, so it must not run while photos are in flux.
  # Re-enable by uncommenting; GitHub re-registers the cron on the next push.
  # schedule:
  #   - cron: "37 6-23 * * *"
  #     timezone: "America/Puerto_Rico"
  workflow_dispatch:
    inputs:
      submit_all_to_indexnow:
        description: "Notify IndexNow about every URL after the sync"
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-inventory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install sharp (image resizing)
        run: npm install --no-save --no-audit --no-fund sharp

      - name: Pull inventory and photos from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/sync-inventory.mjs

      - name: Build crawlable inventory and vehicle pages
        run: node scripts/build-seo-pages.mjs

      - name: Validate generated SEO pages
        run: node scripts/seo.test.mjs

      - name: Commit changes (if any)
        id: inventory_commit
        run: |
          git add js/inventory.json img/cars autos inventario financiamiento historia contacto sitemap.xml
          if git diff --cached --quiet; then
            echo "Inventory unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "valle-inventory-sync"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Sync inventory from Airtable"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify IndexNow
        if: steps.inventory_commit.outputs.changed == 'true' || inputs.submit_all_to_indexnow == true
        run: |
          if [[ "${{ inputs.submit_all_to_indexnow }}" == "true" ]]; then
            node scripts/submit-indexnow.mjs --all
          else
            node scripts/submit-indexnow.mjs --changed
          fi
