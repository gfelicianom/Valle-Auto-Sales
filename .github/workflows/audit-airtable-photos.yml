name: Airtable photo storage check

# Reports which cars still hold full-resolution photos in Airtable, and how
# much storage replacing them would return.
#
# READ-ONLY, and it runs on the read-only sync token. It reports; it never
# replaces a photo. Replacing photos is a separate, deliberate run of
# "Optimize Airtable photos (manual)", which asks for explicit car IDs and
# previews by default.
#
# The monthly run is an alarm, not a report nobody reads: it FAILS once enough
# storage can be reclaimed to be worth a batch, and a failed scheduled run is
# something GitHub emails about. Last time the first warning the family got was
# an email from Airtable saying the base was full.
#
# Runs started by hand report without failing, unless you type a threshold in.
on:
  schedule:
    # 8:15 AM Puerto Rico time on the 1st of each month.
    - cron: "15 8 1 * *"
      timezone: "America/Puerto_Rico"
  workflow_dispatch:
    inputs:
      fail_over_mb:
        description: "Fail the run once this many MB can be reclaimed (blank = report only)"
        required: false
        default: ""
        type: string

concurrency:
  group: audit-airtable-photos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # AIRTABLE_TOKEN is the existing read-only sync token. This workflow
      # needs nothing more than that; it cannot write to the base.
      # A hand-started run reports quietly unless a threshold is typed in; the
      # monthly run always carries one, or it could not raise an alarm.
      - name: Report Airtable photo storage
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          FAIL_OVER_MB: ${{ inputs.fail_over_mb || (github.event_name == 'schedule' && '150' || '') }}
        shell: bash
        run: |
          set -o pipefail
          threshold=()
          if [[ -n "$FAIL_OVER_MB" ]]; then
            threshold=(--fail-over "$FAIL_OVER_MB")
          fi
          node scripts/audit-airtable-photos.mjs "${threshold[@]}" \
            | tee "$RUNNER_TEMP/audit.txt"

      - name: Publish the report on the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Airtable photo storage'
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.txt" 2>/dev/null || echo 'the audit produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
